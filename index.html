<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
        <meta name="description" content="TUEHI GEMSTONE — Đeo đá, đúng gu. Khám phá vòng đá tự nhiên, custom theo sở thích và chọn vòng theo gu riêng."/>
        <meta property="og:title" content="TUEHI GEMSTONE — JUST YOUR GU."/>
        <meta property="og:description" content="Chọn đá theo gu, tạo dấu ấn riêng."/>
        <meta property="og:type" content="website"/>
        <title>TUEHI GEMSTONE — JUST YOUR GU.</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
        <meta name="color-scheme" content="light">
        <style>
            :root {
                --blue: #0c3973;
                --blue2: #123f78;
                --purple: #7255a8;
                --ink: #172033;
                --muted: #6f7582;
                --paper: #fbfaf8;
                --line: #e5e7eb;
                --white: #fff;
                --serif: 'Cormorant Garamond',serif;
                --bodoni: 'Bodoni Moda',serif;
                --sans: 'Montserrat',sans-serif
            }

            * {
                box-sizing: border-box
            }

            html {
                scroll-behavior: smooth
            }

            body {
                margin: 0;
                background: var(--paper);
                color: var(--ink);
                font-family: var(--sans);
                font-size: 14px;
                line-height: 1.7
            }

            a {
                text-decoration: none;
                color: inherit
            }

            button,input,select {
                font: inherit
            }

            button {
                cursor: pointer
            }

            .loader {
                position: fixed;
                inset: 0;
                z-index: 1000;
                background: var(--blue);
                color: #fff;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                transition: opacity .6s,visibility .6s
            }

            .loader.hide {
                opacity: 0;
                visibility: hidden
            }

            .loader-mark {
                font-size: 42px;
                letter-spacing: .16em;
                font-weight: 600
            }

            .loader-slogan {
                font-family: var(--bodoni);
                font-size: 15px;
                letter-spacing: .12em;
                margin-top: 8px
            }

            .loader-slogan em {
                font-style: italic
            }

            .site-header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 100;
                background: rgb(255 170 0 / 90%);
                backdrop-filter: blur(16px);
                border-bottom: 1px solid rgba(12,57,115,.08);
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 78px;
                padding: 0 4vw
            }

            .brand {
                display: flex;
                flex-direction: column;
                line-height: 1;
                letter-spacing: .08em
            }

            .brand span {
                font-weight: 700;
                font-size: 21px
            }

            .brand small {
                font-size: 8px;
                letter-spacing: .25em;
                margin-top: 4px
            }

            .desktop-nav {
                display: flex;
                gap: 24px;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: .05em
            }

            .desktop-nav a:hover,.contact-links a:hover {
                color: var(--purple)
            }

            .header-actions {
                display: flex;
                align-items: center;
                gap: 8px
            }

            .icon-btn,.lang-btn,.mobile-menu-btn {
                border: 0;
                background: transparent;
                min-width: 40px;
                height: 40px;
                position: relative
            }

            .icon-btn span {
                position: absolute;
                top: 0;
                right: 0;
                background: var(--purple);
                color: #fff;
                border-radius: 50%;
                font-size: 8px;
                min-width: 15px;
                height: 15px;
                display: grid;
                place-items: center
            }

            .lang-btn {
                font-size: 10px;
                font-weight: 600
            }

            .mobile-menu-btn {
                display: none
            }

            .section {
                padding: 110px 7vw;
                position: relative
            }

            .hero {
                min-height: 760px;
                padding-top: 150px;
                display: grid;
                grid-template-columns: 1.05fr .95fr;
                align-items: center;
                gap: 7vw;
                background: linear-gradient(120deg,#f8f8f8 0%,#f4f0f9 100%)
            }

            .hero-visual {
                height: 530px;
                position: relative;
                display: grid;
                place-items: center
            }

            .hero-bracelet {
                width: 390px;
                height: 390px;
                border-radius: 50%;
                background: radial-gradient(circle at 50% 50%,transparent 0 34%,#fff 35% 37%,transparent 38%),conic-gradient(from 15deg,#a87d95,#d9b5ca,#8c6b77,#f0d5e1,#a87d95);
                box-shadow: 0 35px 70px rgba(35,43,66,.2),inset 0 0 0 10px rgba(255,255,255,.55);
                filter: saturate(.9);
                position: relative
            }

            .hero-bracelet:after {
                content: "";
                position: absolute;
                inset: 18%;
                border-radius: 50%;
                border: 18px dotted rgba(255,255,255,.9);
                transform: rotate(8deg)
            }

            .hero-badge {
                position: absolute;
                right: 5%;
                bottom: 8%;
                background: #fff;
                padding: 14px 18px;
                font-size: 9px;
                letter-spacing: .14em;
                box-shadow: 0 15px 40px rgba(0,0,0,.08)
            }

            .hero-badge span {
                font-family: var(--bodoni);
                font-size: 12px
            }

            .eyebrow {
                font-size: 10px;
                letter-spacing: .2em;
                color: var(--purple);
                font-weight: 700;
                margin: 0 0 15px
            }

            .hero-copy h1,.final-cta h2,.custom-copy h2,.story-copy h2,.why-heading h2,.contact h2 {
                font-family: var(--serif);
                font-weight: 600;
                font-size: clamp(48px,7vw,92px);
                line-height: .9;
                margin: 0 0 25px;
                letter-spacing: -.03em
            }

            .hero-copy h1 em,.final-cta h2 em,.custom-copy h2 em,.story-copy h2 em,.why-heading h2 em,.contact h2 em {
                font-family: var(--bodoni);
                font-style: italic
            }

            .hero-copy>p:not(.eyebrow) {
                max-width: 570px;
                color: #5f6570;
                font-size: 15px
            }

            .hero-actions,.custom-actions,.drawer-actions {
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
                margin-top: 28px
            }

            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 46px;
                padding: 0 20px;
                border: 1px solid var(--blue);
                font-size: 10px;
                font-weight: 700;
                letter-spacing: .08em;
                transition: .25s
            }

            .btn-primary {
                background: var(--blue);
                color: #fff
            }

            .btn-primary:hover {
                background: #082b58;
                transform: translateY(-2px)
            }

            .btn-outline {
                background: transparent;
                color: var(--blue)
            }

            .btn-outline:hover {
                background: var(--blue);
                color: #fff
            }

            .section-head {
                display: flex;
                justify-content: space-between;
                align-items: end;
                gap: 20px;
                margin-bottom: 40px
            }

            .section-head h2 {
                font-family: var(--serif);
                font-size: 48px;
                line-height: 1;
                margin: 0
            }

            .text-link {
                font-size: 10px;
                font-weight: 700;
                letter-spacing: .1em
            }

            .product-grid {
                display: grid;
                grid-template-columns: repeat(4,1fr);
                gap: 18px
            }

            .product-card {
                position: relative;
                background: #fff;
                border: 1px solid var(--line);
                transition: .3s;
                overflow: hidden
            }

            .product-card:hover {
                transform: translateY(-6px);
                box-shadow: 0 20px 50px rgba(20,28,50,.08)
            }

            .product-visual {
                height: 300px;
                background: linear-gradient(135deg,#f0edf1,#fbfbfb);
                display: grid;
                place-items: center;
                position: relative
            }

            .gem-ring {
                width: 185px;
                height: 185px;
                border-radius: 50%;
                background: conic-gradient(from 0deg,var(--gem1),var(--gem2),var(--gem3),var(--gem1));
                box-shadow: 0 20px 40px rgba(30,40,60,.18),inset 0 0 0 10px rgba(255,255,255,.55);
                position: relative
            }

            .gem-ring:after {
                content: "";
                position: absolute;
                inset: 26%;
                border-radius: 50%;
                border: 15px solid rgba(255,255,255,.65)
            }

            .heart {
                position: absolute;
                top: 14px;
                right: 14px;
                border: 0;
                background: #fff;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                font-size: 19px;
                box-shadow: 0 8px 20px rgba(0,0,0,.08)
            }

            .heart.active {
                color: #9b5379
            }

            .product-info {
                padding: 18px
            }

            .product-info h3 {
                font-size: 13px;
                margin: 0 0 8px
            }

            .product-info .stone {
                font-size: 10px;
                color: var(--muted)
            }

            .price {
                font-weight: 700;
                margin-top: 10px
            }

            .meta {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                color: var(--muted);
                font-size: 9px;
                margin-top: 8px
            }

            .quiz-section {
                background: var(--blue);
                color: #fff
            }

            .quiz-panel {
                display: grid;
                grid-template-columns: .9fr 1.1fr;
                gap: 60px;
                align-items: center
            }

            .quiz-intro h2 {
                font-family: var(--serif);
                font-size: 64px;
                line-height: .92;
                margin: 0 0 20px
            }

            .quiz-intro h2 em {
                font-family: var(--bodoni);
                font-style: italic
            }

            .quiz-intro p:not(.eyebrow) {
                color: #dbe6f4;
                max-width: 500px
            }

            .quiz-box {
                background: #fff;
                color: var(--ink);
                min-height: 390px;
                padding: 36px
            }

            .quiz-question {
                font-family: var(--serif);
                font-size: 34px;
                line-height: 1.1;
                margin-bottom: 24px
            }

            .quiz-options {
                display: grid;
                gap: 10px
            }

            .quiz-option {
                border: 1px solid var(--line);
                background: #fff;
                padding: 15px;
                text-align: left
            }

            .quiz-option:hover {
                border-color: var(--purple);
                background: #f8f5fb
            }

            .quiz-result {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 10px
            }

            .story {
                display: grid;
                grid-template-columns: .9fr 1.1fr;
                gap: 7vw;
                align-items: center;
                background: #eaf0fb
            }

            .story-image img {
                width: 100%;
                display: block
            }

            .story-copy p {
                max-width: 680px;
                color: #58606e
            }

            .value-list {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 10px;
                margin-top: 30px
            }

            .value-list div {
                border-top: 1px solid rgba(12,57,115,.2);
                padding-top: 12px
            }

            .value-list b {
                font-size: 10px;
                color: var(--purple);
                display: block
            }

            .value-list span {
                font-weight: 700;
                font-size: 12px
            }

            .tabs {
                display: flex;
                gap: 8px
            }

            .tab,.filter {
                border: 1px solid var(--line);
                background: #fff;
                padding: 10px 14px;
                font-size: 9px;
                font-weight: 700;
                letter-spacing: .08em
            }

            .tab.active,.filter.active {
                background: var(--blue);
                color: #fff;
                border-color: var(--blue)
            }

            .why {
                background: #f2eff7;
                display: grid;
                grid-template-columns: .8fr 1.2fr;
                gap: 8vw
            }

            .why-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 30px
            }

            .why-grid article {
                border-top: 1px solid rgba(12,57,115,.18);
                padding-top: 16px
            }

            .why-grid span {
                font-size: 10px;
                color: var(--purple);
                font-weight: 700
            }

            .why-grid h3 {
                font-family: var(--serif);
                font-size: 28px;
                margin: 12px 0 6px
            }

            .why-grid p {
                color: var(--muted)
            }

            .custom {
                background: #fff;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 5vw;
                align-items: center
            }

            .custom-controls {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin-top: 25px
            }

            .custom-controls label {
                font-size: 10px;
                font-weight: 700;
                display: grid;
                gap: 6px
            }

            .custom-controls select {
                border: 1px solid var(--line);
                background: #fff;
                padding: 12px
            }

            .viewer {
                background: #f2f5f9;
                min-height: 560px;
                border: 1px solid var(--line);
                position: relative;
                overflow: hidden
            }

            .viewer-label {
                position: absolute;
                top: 14px;
                left: 14px;
                font-size: 9px;
                letter-spacing: .08em;
                color: var(--muted);
                z-index: 2
            }

            .blog-grid {
                display: grid;
                grid-template-columns: 1.5fr 1fr 1fr;
                gap: 18px
            }

            .blog-feature {
                grid-row: span 2
            }

            .blog-grid article {
                background: #fff;
                padding-bottom: 18px
            }

            .blog-image {
                height: 220px
            }

            .blog-feature .blog-image {
                height: 380px
            }

            .tone-pink {
                background: radial-gradient(circle at 60% 40%,#e3c2d1,#7b536d 55%,#202f4c)
            }

            .tone-blue {
                background: radial-gradient(circle at 50% 50%,#b5d1ea,#1d4b78)
            }

            .tone-purple {
                background: radial-gradient(circle at 40% 50%,#d6c8e6,#5f4d7e)
            }

            .tone-sand {
                background: radial-gradient(circle at 60% 30%,#e8d9c4,#7c6c58)
            }

            .blog-grid .eyebrow,.blog-grid h3,.blog-grid p {
                margin-left: 18px;
                margin-right: 18px
            }

            .blog-grid h3 {
                font-family: var(--serif);
                font-size: 30px;
                line-height: 1.05;
                margin-top: 6px
            }

            .reviews {
                background: #f7f7f5
            }

            .review-filters {
                display: flex;
                gap: 8px
            }

            .review-grid {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 18px
            }

            .review-grid article {
                background: #fff;
                padding: 26px;
                border: 1px solid var(--line)
            }

            .stars {
                letter-spacing: .15em;
                color: #b28b38
            }

            .review-grid p {
                font-family: var(--serif);
                font-size: 25px;
                line-height: 1.15
            }

            .review-grid small {
                color: var(--muted)
            }

            .final-cta {
                background: var(--blue);
                color: #fff;
                display: flex;
                justify-content: space-between;
                align-items: end;
                gap: 30px
            }

            .final-cta .eyebrow {
                color: #b9cbe4
            }

            .final-cta h2 {
                margin-bottom: 15px
            }

            .final-cta p:not(.eyebrow) {
                color: #dbe6f4
            }

            .final-cta .btn-primary {
                background: #fff;
                color: var(--blue);
                border-color: #fff
            }

            .contact {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8vw;
                align-items: end
            }

            .contact-links {
                display: grid
            }

            .contact-links a {
                font-family: var(--serif);
                font-size: 38px;
                padding: 12px 0;
                border-bottom: 1px solid var(--line)
            }

            .footer {
                background: var(--blue);
                color: #fff;
                padding: 65px 7vw 25px
            }

            .footer-top {
                display: grid;
                grid-template-columns: 1.4fr 1fr 1fr;
                gap: 60px
            }

            .footer .brand {
                margin-bottom: 20px
            }

            .footer-brand p {
                font-weight: 700;
                margin: 0
            }

            .footer-brand strong {
                font-family: var(--bodoni);
                font-size: 18px
            }

            .footer h4 {
                font-size: 10px;
                letter-spacing: .16em;
                margin: 0 0 18px;
                color: #bcd0e8
            }

            .footer-top>div:not(.footer-brand) {
                display: grid;
                align-content: start;
                gap: 9px
            }

            .footer-top a {
                color: #e7eef8;
                font-size: 12px
            }

            .footer-bottom {
                border-top: 1px solid rgba(255,255,255,.2);
                margin-top: 50px;
                padding-top: 18px;
                display: flex;
                justify-content: space-between;
                color: #bcd0e8;
                font-size: 9px
            }

            .search-modal {
                position: fixed;
                inset: 0;
                background: rgba(5,20,40,.55);
                z-index: 300;
                display: grid;
                place-items: start center;
                padding-top: 120px
            }

            .search-panel {
                width: min(720px,90vw);
                background: #fff;
                padding: 35px;
                position: relative
            }

            .search-panel input {
                width: 100%;
                border: 0;
                border-bottom: 1px solid var(--line);
                padding: 16px 0;
                font-size: 18px;
                outline: 0
            }

            .close {
                border: 0;
                background: transparent;
                font-size: 28px;
                position: absolute;
                right: 20px;
                top: 15px
            }

            .search-result {
                padding: 15px 0;
                border-bottom: 1px solid var(--line);
                display: flex;
                justify-content: space-between
            }

            .drawer {
                position: fixed;
                top: 0;
                right: 0;
                width: min(440px,92vw);
                height: 100%;
                background: #fff;
                z-index: 250;
                transform: translateX(105%);
                transition: .35s;
                box-shadow: -20px 0 50px rgba(0,0,0,.15);
                padding: 28px;
                display: flex;
                flex-direction: column
            }

            .drawer.open {
                transform: translateX(0)
            }

            .drawer-head {
                display: flex;
                justify-content: space-between;
                border-bottom: 1px solid var(--line);
                padding-bottom: 15px
            }

            .drawer-head h3 {
                font-size: 12px;
                letter-spacing: .12em
            }

            .cart-row,.wish-row {
                display: grid;
                grid-template-columns: 70px 1fr auto;
                gap: 12px;
                padding: 15px 0;
                border-bottom: 1px solid var(--line);
                align-items: center
            }

            .mini-visual {
                height: 65px;
                background: linear-gradient(135deg,#eee,#fff);
                display: grid;
                place-items: center
            }

            .mini-ring {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                background: var(--gem)
            }

            .drawer-foot {
                margin-top: auto;
                border-top: 1px solid var(--line);
                padding-top: 20px
            }

            .total {
                display: flex;
                justify-content: space-between;
                margin-bottom: 16px
            }

            .toast {
                position: fixed;
                right: 24px;
                bottom: 24px;
                background: var(--blue);
                color: #fff;
                padding: 12px 18px;
                font-size: 10px;
                letter-spacing: .04em;
                opacity: 0;
                transform: translateY(15px);
                pointer-events: none;
                transition: .25s;
                z-index: 400
            }

            .toast.show {
                opacity: 1;
                transform: translateY(0)
            }

            #threeMount {
                width: 100%;
                height: 100%;
                min-height: 560px
            }

            .mobile-menu {
                display: none
            }

            @media(max-width: 1100px) {
                .desktop-nav {
                    gap:13px;
                    font-size: 9px
                }

                .product-grid {
                    grid-template-columns: repeat(2,1fr)
                }

                .hero {
                    grid-template-columns: 1fr
                }

                .hero-visual {
                    order: 0
                }

                .hero-copy {
                    order: 1
                }

                .custom,.story,.why,.contact {
                    grid-template-columns: 1fr
                }

                .blog-grid {
                    grid-template-columns: 1fr 1fr
                }

                .blog-feature {
                    grid-row: auto
                }

                .quiz-panel {
                    grid-template-columns: 1fr
                }

                .footer-top {
                    grid-template-columns: 1fr 1fr
                }
            }

            @media(max-width: 760px) {
                body {
                    font-size:13px
                }

                .site-header {
                    height: 68px;
                    padding: 0 18px
                }

                .desktop-nav,.lang-btn {
                    display: none
                }

                .mobile-menu-btn {
                    display: block
                }

                .mobile-menu {
                    position: fixed;
                    top: 68px;
                    left: 0;
                    right: 0;
                    background: rgba(251,250,248,.98);
                    z-index: 90;
                    transform: translateY(-120%);
                    transition: .3s;
                    border-bottom: 1px solid var(--line)
                }

                .mobile-menu.open {
                    transform: translateY(0);
                    display: block
                }

                .mobile-menu-inner {
                    display: grid;
                    padding: 18px
                }

                .mobile-menu a {
                    padding: 12px 0;
                    border-bottom: 1px solid var(--line);
                    font-weight: 600
                }

                .section {
                    padding: 78px 18px
                }

                .hero {
                    min-height: auto;
                    padding-top: 110px;
                    text-align: center;
                    gap: 30px
                }

                .hero-visual {
                    height: 380px
                }

                .hero-bracelet {
                    width: 290px;
                    height: 290px
                }

                .hero-badge {
                    right: 0;
                    bottom: 0
                }

                .hero-copy h1 {
                    font-size: 62px
                }

                .hero-actions .btn-outline {
                    display: none
                }

                .hero-actions {
                    justify-content: center
                }

                .section-head {
                    align-items: start;
                    flex-direction: column

            /* quiz */

            .qz-top {
                display: flex;

                font-weight: 700;

                height: 4px;
                background: #e8ebf2;

                height: 100%;
                background: var(--purple);

                text-align: left;
                cursor: pointer;
                transition: .2s;
                min-height: 70px

                width: 34px;
                height: 34px;
                border-radius: 50%;

                display: grid;
                place-items: center;
                font-weight: 700;
                font-size: 13px

                background: #f8f5fb;

            .quiz-option.sel {
                border-color: var(--purple);
                background: var(--purple);

            /* hero */

            /* bands */
            .section-head h2,.about-head h2 {
                color: var(--blue)
            }

            .section-head h2 em {
                color: var(--purple)
            }

            .featured {
                background: linear-gradient(180deg,#fff 0%,#eef4fd 100%);

            }

            .quiz-section {
                background: radial-gradient(700px 400px at 90% 10%,rgba(150,110,230,.45),transparent 60%),linear-gradient(135deg,#0a2f66,#1b3f95 55%,#4d3a9f)
            }

            .about-head {
                background: linear-gradient(180deg,#eef4fd,#f4eefb)
            }

            .loved {
                background: linear-gradient(180deg,#fff,#f4effa)
            }

            }

            }

            .why-grid article {

            }

            .why-heading h2 {

            }

            .why-heading h2 em {
                color: var(--purple)
            }

            .process {
                background: linear-gradient(135deg,#e9f1fc,#f2ebfa)
            }

            .process-copy h2 em {
                color: var(--purple)
            }

            .custom {
                background: linear-gradient(180deg,#fff,#edf3fc)
            }

            .custom-copy h2 {
                color: var(--blue)
            }

            .custom-copy h2 em {
                color: var(--purple)
            }

            .viewer {
                background: linear-gradient(135deg,#eaf1fc,#f2ecfb)
            }

            .blog {
                background: #fff
            }

            .reviews {
                background: linear-gradient(135deg,#f3edfa,#e8f0fc)
            }

            .review-grid article {
                border-top: 4px solid var(--purple);
                box-shadow: 0 12px 30px rgba(12,57,115,.08)
            }

            .review-grid p {
                color: var(--blue)
            }

            .stars {
                color: #f0b429
            }

            .final-cta {
                background: linear-gradient(120deg,#0a2f66,#3b3a95 65%,#6b4fb0)
            }

            .final-cta h2,.final-cta h2 em {
                color: #fff
            }

            .final-cta h2 em {
                color: #d7c6ff
            }

            .contact {
                background: radial-gradient(600px 360px at 85% 0%,rgba(150,110,230,.4),transparent 60%),linear-gradient(135deg,#0a2f66,#1c3d8f 55%,#4d3a9f);
                color: #fff;
                align-items: center
            }

            .contact h2 {
                color: #fff
            }

            .contact h2 em {
                color: #d7c6ff
            }

            .contact .eyebrow {
                color: #c9b8ff
            }

            .contact-note p {
                font-size: 16px;
                line-height: 1.8;
                color: #dbe6f4;
                max-width: 480px
            }

            .contact-note .hint {
                font-size: 12px;
                color: #b9a9f0;
                letter-spacing: .06em
            }

            .footer {
                background: linear-gradient(180deg,#0a2f66,#071f47)
            }

            .footer h4 {
                color: #c9b8ff
            }

            .btn-primary {
                background: var(--grad);
                border-color: transparent
            }

            .btn-primary:hover {
                background: linear-gradient(100deg,#082b58,#4d3a9f)
            }

            .btn-outline {
                border-color: var(--purple);
                color: var(--purple)
            }

            .btn-outline:hover {
                background: var(--purple);
                border-color: var(--purple)
            }

            .product-card {
                border-color: #e3e0f0
            }

            .product-card:hover {
                border-color: var(--purple);
                box-shadow: 0 20px 50px rgba(114,85,168,.18)
            }

            .product-info h3 {
                color: var(--blue)
            }

            .price {
                color: var(--purple)!important
            }

            .tab.active,.filter.active {
                background: var(--grad);
                border-color: transparent
            }

            /* about blocks */
            .ab {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6vw;
                align-items: center
            }

            .ab-img img {
                width: 100%;
                aspect-ratio: 4/5;
                object-fit: cover;
                display: block;
                box-shadow: 0 26px 60px rgba(12,57,115,.22)
            }

            .ab-copy h2 {
                font-family: var(--serif);
                font-weight: 600;
                font-size: clamp(40px,5vw,70px);
                line-height: .95;
                margin: 0 0 22px;
                color: var(--blue);
                letter-spacing: -.02em
            }

            .ab-copy h2 em {
                color: var(--purple)
            }

            .ab-copy p {
                font-size: 15px;
                line-height: 1.85;
                color: #44506a;
                max-width: 560px
            }

            .ab-copy strong {
                color: var(--blue)
            }

            .slogan-line {
                font-family: var(--bodoni);
                font-size: 26px!important;
                letter-spacing: .06em;
                color: var(--blue)!important;
                margin-top: 24px
            }

            .slogan-line em {
                color: var(--purple)
            }

            .ab-story {
                background: linear-gradient(135deg,#e9f1fc,#f1ebfa)
            }

            .ab-value {
                background: linear-gradient(135deg,#f6f0fc,#fdf3f8)
            }

            .ab-value.flip .ab-img {
                order: 2
            }

            .value-chips {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 10px;
                margin-top: 22px
            }

            .value-chips div {
                border: 1px solid rgba(114,85,168,.35);
                background: #fff;
                padding: 14px 10px;
                text-align: center
            }

            .value-chips b {
                display: block;
                font-family: var(--bodoni);
                color: var(--purple);
                font-size: 20px
            }

            .value-chips span {
                font-size: 9px;
                font-weight: 700;
                letter-spacing: .1em;
                color: var(--blue)
            }

            .ab-why {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6vw;
                align-items: center;
                background: radial-gradient(700px 400px at 100% 0%,rgba(160,120,240,.4),transparent 60%),linear-gradient(135deg,#0a2f66,#27408f 60%,#5a3fa0);
                color: #fff
            }

            .ab-why .eyebrow {
                color: #c9b8ff
            }

            .ab-why h2 {
                font-family: var(--serif);
                font-weight: 600;
                font-size: clamp(42px,6vw,84px);
                line-height: .92;
                margin: 0 0 28px;
                letter-spacing: -.02em;
                color: #fff
            }

            .ab-why h2 em {
                color: #d7c6ff
            }

            .since {
                display: inline-grid;
                gap: 2px;
                border-left: 3px solid #b79cff;
                padding-left: 16px
            }

            .since b {
                font-family: var(--bodoni);
                font-size: 44px;
                line-height: 1;
                color: #fff
            }

            .since span {
                font-size: 10px;
                letter-spacing: .18em;
                color: #cfdcff;
                font-weight: 700
            }

            .ab-why-r p {
                font-size: 16px;
                line-height: 1.9;
                color: #e4ecfa;
                margin: 0 0 18px;
                max-width: 560px
            }

            @media(max-width: 800px) {
                .ab,.ab-why {
                    grid-template-columns:1fr;
                    gap: 28px
                }

                .ab-value.flip .ab-img {
                    order: 0
                }

                .ab-img img {
                    aspect-ratio: 1/1
                }

                .value-chips {
                    grid-template-columns: 1fr
                }
            }

            /* dock */
            .dock {
                position: fixed;
                right: max(10px,env(safe-area-inset-right,0px));
                top: 50%;
                transform: translateY(-50%);
                display: flex;
                flex-direction: column;
                gap: 10px;
                z-index: 95;
                padding: 10px 7px;
                background: rgba(255,255,255,.88);
                backdrop-filter: blur(10px);
                border-radius: 999px;
                box-shadow: 0 10px 30px rgba(12,57,115,.25)
            }

            .dock a {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                color: #fff;
                position: relative;
                transition: .2s;
                text-decoration: none
            }

            .dock a svg {
                width: 20px;
                height: 20px
            }

            .dock a:hover {
                transform: scale(1.12)
            }

            .dock a::after {
                content: attr(data-tip);
                position: absolute;
                right: 52px;
                top: 50%;
                transform: translateY(-50%);
                background: #0c3973;
                color: #fff;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: .08em;
                padding: 6px 10px;
                border-radius: 4px;
                white-space: nowrap;
                opacity: 0;
                pointer-events: none;
                transition: .2s
            }

            .dock a:hover::after {
                opacity: 1
            }

            .d-fb,.f-fb i {
                background: #1877f2
            }

            .d-ig,.f-ig i {
                background: linear-gradient(45deg,#f9a03f,#e1306c 55%,#7a3fd1)
            }

            .d-sp,.f-sp i {
                background: #ee4d2d
            }

            .d-tt,.f-tt i {
                background: #111
            }

            .d-ml,.f-ml i {
                background: var(--purple)
            }

            @media(max-width: 600px) {
                .dock {
                    padding:7px 5px;
                    gap: 7px
                }

                .dock a {
                    width: 34px;
                    height: 34px
                }

                .dock a svg {
                    width: 17px;
                    height: 17px
                }

                .dock a::after {
                    display: none
                }
            }

            /* footer icons */
            .footer .f-ic {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 0 0 12px;
                color: #fff;
                text-decoration: none;
                font-size: 13px
            }

            .footer .f-ic i {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                flex: none;
                transition: .2s
            }

            .footer .f-ic i svg {
                width: 17px;
                height: 17px;
                color: #fff
            }

            .footer .f-ic:hover {
                color: #d7c6ff
            }

            .footer .f-ic:hover i {
                transform: scale(1.1)
            }
        </style>
